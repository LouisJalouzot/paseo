name: Patch Upstream Release

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag; empty uses the latest stable release"
        required: false
        type: string
      patched_revision:
        description: "Patched tag revision"
        required: false
        default: "1"
        type: string
permissions:
  contents: write
  issues: write

concurrency:
  group: patch-upstream-release
  cancel-in-progress: false

jobs:
  patch-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select upstream release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          REQUESTED_REVISION: ${{ inputs.patched_revision }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/getpaseo/paseo/releases/latest --jq .tag_name)"
          fi
          revision="${REQUESTED_REVISION:-1}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid patched revision: $revision" >&2
            exit 1
          fi

          patched_tag="${tag}-patched.${revision}"
          echo "upstream_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "patched_tag=$patched_tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$patched_tag" >/dev/null 2>&1; then
            echo "source_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$patched_tag" --json assets \
            --jq 'any(.assets[]; .name | endswith(".AppImage"))' | grep -qx true; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$patched_tag and its AppImage already exist"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm

      - uses: cachix/install-nix-action@v31
        if: steps.release.outputs.skip == 'false'

      - name: Check out patched source
        if: steps.release.outputs.skip == 'false'
        env:
          SOURCE_EXISTS: ${{ steps.release.outputs.source_exists }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          PATCHED_TAG: ${{ steps.release.outputs.patched_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$SOURCE_EXISTS" == "true" ]]; then
            git fetch --force origin "refs/tags/$PATCHED_TAG:refs/tags/$PATCHED_TAG"
            git switch --detach "$PATCHED_TAG"
            exit 0
          fi

          git remote add upstream https://github.com/getpaseo/paseo.git
          git fetch --force upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git fetch --force origin refs/heads/patched-release:refs/remotes/origin/patched-release
          git switch --detach "$(git rev-list -n 1 "$UPSTREAM_TAG")"
          git switch -c "patched-$UPSTREAM_TAG"

          # Keep this list in release order. Rebase the series manually when an
          # upstream release changes a patched file, then update these SHAs.
          patch_commits=(
            df9706a4d # LaTeX, rebased onto v0.4.0
            35730e9ee # LaTeX settings schema compatibility
            e2cfba71f # OMP guard, rebased onto v0.4.0
            73a46f8c3 # Pi background-task notifications, rebased onto v0.4.0
            3512e4587 # Pi session names, rebased onto v0.4.0
            c32533c53 # Backgrounded mobile push routing, rebased onto v0.4.0
          )
          for patch in "${patch_commits[@]}"; do
            if ! git cat-file -e "$patch^{commit}"; then
              echo "::error::Maintained patch $patch is missing from origin/patched-release" >&2
              exit 1
            fi
            if ! git cherry-pick "$patch"; then
              echo "::error::Patch $patch conflicts with $UPSTREAM_TAG; resolve the patch series and update patch_commits" >&2
              git status --short
              exit 1
            fi
          done

      - name: Update Nix dependency hash
        if: steps.release.outputs.skip == 'false' && steps.release.outputs.source_exists == 'false'
        run: |
          ./scripts/update-nix.sh
          git add package-lock.json nix/npm-deps.hash
          if ! git diff --cached --quiet; then
            git commit -m "fix(nix): update npm dependency hash"
          fi

      - name: Verify patched release
        if: steps.release.outputs.skip == 'false'
        run: |
          npm ci
          npm run build:app-deps
          npx vitest run \
            packages/app/src/utils/__tests__/split-markdown-blocks.test.ts \
            packages/app/src/utils/markdown-math.test.ts \
            packages/app/src/components/math-formula.browser.test.tsx \
            --environment jsdom --bail=1
          npm run typecheck --workspace=@getpaseo/app
          nix build .#default

      - name: Build patched AppImage
        if: steps.release.outputs.skip == 'false'
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          EP_GH_IGNORE_TIME: "true"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          version="${UPSTREAM_TAG#v}"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = "packages/desktop/package.json";
            const json = JSON.parse(fs.readFileSync(path, "utf8"));
            json.version = process.argv[1];
            fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          ' "$version"
          npm run build:desktop -- \
            --publish never \
            --linux \
            --x64 \
            -c.publish.provider=github \
            -c.publish.owner=LouisJalouzot \
            -c.publish.repo=paseo \
            -c.publish.releaseType=release \
            -c.publish.channel=latest

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish patched source
        if: steps.release.outputs.skip == 'false' && steps.release.outputs.source_exists == 'false'
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          PATCHED_TAG: ${{ steps.release.outputs.patched_tag }}
        run: |
          git tag -a "$PATCHED_TAG" -m "Paseo $UPSTREAM_TAG with local patches"
          old="$(git ls-remote origin refs/heads/patched-release | cut -f1)"
          git push --atomic \
            --force-with-lease="refs/heads/patched-release:$old" \
            origin \
            "HEAD:refs/heads/patched-$UPSTREAM_TAG" \
            "refs/tags/$PATCHED_TAG" \
            HEAD:refs/heads/patched-release

      - name: Publish patched AppImage
        if: steps.release.outputs.skip == 'false'
        env:
          PATCHED_TAG: ${{ steps.release.outputs.patched_tag }}
        run: |
          if ! gh release view "$PATCHED_TAG" >/dev/null 2>&1; then
            gh release create "$PATCHED_TAG" \
              --verify-tag \
              --title "Paseo $PATCHED_TAG" \
              --notes "Patched Paseo release with LaTeX rendering and local provider fixes."
          fi
          mapfile -d '' files < <(
            find packages/desktop/release -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.AppImage.blockmap' -o -name '*-linux.yml' \) \
              -print0
          )
          if (( ${#files[@]} == 0 )); then
            echo "No AppImage release artifacts found" >&2
            exit 1
          fi
          gh release upload "$PATCHED_TAG" "${files[@]}" --clobber

      - name: Summarize release failure
        if: failure()
        continue-on-error: true
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## Patched release failed"
            echo
            echo "Upstream tag: ${UPSTREAM_TAG:-unknown}"
            echo "Run: $run_url"
            echo
            echo "### Checkout status"
            echo '```text'
            git status --short || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues' | grep -qx true; then
            gh issue create \
              --title "Failed to patch Paseo ${UPSTREAM_TAG:-release}" \
              --body "The automated release patch failed. Inspect run: $run_url"
          else
            echo "::warning::GitHub Issues are disabled; failure details are in the job summary: $run_url"
          fi
